<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我要成為LV999哥布林</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: #1a1d2d;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --accent-gold: #f1c40f;
      --accent-purple: #9b59b6;
      --accent-blue: #3498db;
      --text-light: #ecf0f1;
      --text-muted: #8e9aaf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 15px; }
    header { text-align: center; padding: 12px; background: var(--card-bg); border-radius: 12px; border: 1px solid #2d3248; }
    header h1 { color: var(--accent-green); font-size: 1.8rem; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #2d3248; }

    /* 哥布林狀態面板 */
    .goblin-status { display: flex; align-items: center; gap: 15px; }
    .goblin-avatar-box { width: 110px; height: 110px; border-radius: 12px; border: 3px solid var(--accent-green); overflow: hidden; background: #000; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #8e9aaf; font-size: 0.8rem; text-align: center; }
    .goblin-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .status-info { flex: 1; }
    .level-badge { display: inline-block; background: var(--accent-purple); padding: 3px 10px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; color: #fff; margin-bottom: 4px; }
    .exp-bar-container { background: #0f111a; height: 14px; border-radius: 7px; overflow: hidden; margin: 6px 0; border: 1px solid #3a3f58; }
    .exp-bar { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); width: 0%; transition: width 0.3s ease; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; text-align: center; }
    .stat-item { background: #25293c; padding: 6px; border-radius: 6px; }
    .stat-item label { font-size: 0.75rem; color: var(--text-muted); display: block; }
    .stat-item val { font-size: 1rem; font-weight: bold; color: var(--accent-gold); }

    /* 技能與按鈕 */
    .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .skill-btn { background: #25293c; border: 1px solid #3a3f58; color: #fff; padding: 8px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; }
    .skill-btn:hover { background: #323750; border-color: var(--accent-gold); }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-green { background: var(--accent-green); color: #fff; }
    .btn-red { background: var(--accent-red); color: #fff; }
    .btn-blue { background: var(--accent-blue); color: #fff; }

    /* 戒色修煉 */
    .nopmo-card { border: 1px solid var(--accent-purple); background: linear-gradient(135deg, #1a1d2d, #251b34); }
    .nopmo-flex { display: flex; justify-content: space-between; align-items: center; }
    .streak-count { font-size: 2rem; font-weight: bold; color: var(--accent-gold); }

    /* 任務面板 */
    .category-title { font-size: 1rem; color: var(--accent-gold); margin: 12px 0 8px 0; border-bottom: 1px solid #2d3248; padding-bottom: 4px; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: #25293c; padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; }
    .done-tag { color: var(--accent-green); font-weight: bold; font-size: 0.85rem; }

    /* Boss 地下城 */
    .boss-card { text-align: center; border: 1px solid var(--accent-red); background: linear-gradient(180deg, #1a1d2d, #2d151c); }
    .boss-avatar { font-size: 1.2rem; font-weight: bold; color: var(--accent-gold); margin: 8px 0; }
    .boss-phase-badge { background: var(--accent-red); color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
    .hp-bar-container { background: #0f111a; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0; border: 1px solid #3a3f58; }
    .hp-bar { height: 100%; background: var(--accent-red); width: 100%; transition: width 0.3s ease; }

    /* 排行榜 */
    .leaderboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .leaderboard-table { width: 100%; border-collapse: collapse; }
    .leaderboard-table th, .leaderboard-table td { padding: 6px 8px; border-bottom: 1px solid #2d3248; text-align: left; font-size: 0.85rem; }
    .leaderboard-table th { color: var(--accent-gold); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>我要成為LV999哥布林</h1>
  </header>

  <!-- 狀態面板 -->
  <div class="card goblin-status">
    <div class="goblin-avatar-box">
      <img id="goblinImg" src="哥布林進化路線插圖 (3).jpg" alt="哥布林頭像" onerror="this.style.display='none'; this.parentElement.innerText='哥布林頭像';">
    </div>
    <div class="status-info">
      <div>
        <span class="level-badge" id="goblinRank">油頭KAM撚哥布林</span>
        <strong style="font-size: 1.1rem; margin-left: 6px;">Lv. <span id="goblinLv">1</span> / 999</strong>
      </div>
      <div class="exp-bar-container"><div class="exp-bar" id="expBar"></div></div>
      <div style="font-size: 0.8rem; color: var(--text-muted);">
        EXP: <span id="currentExp">0</span> / <span id="maxExp">10</span>
      </div>
      <div class="stats-grid">
        <div class="stat-item"><label>體能 (STR)</label><val id="statStr">5</val></div>
        <div class="stat-item"><label>智力 (INT)</label><val id="statInt">5</val></div>
        <div class="stat-item"><label>意志 (WIL)</label><val id="statWil">5</val></div>
        <div class="stat-item"><label>活力 (VIT)</label><val id="statVit">5</val></div>
      </div>
    </div>
  </div>

  <!-- 主動自律技能面板 -->
  <div class="card">
    <h3 style="color: var(--accent-gold); font-size: 1rem; margin-bottom: 5px;">主動自律技能</h3>
    <div class="skills-grid">
      <button class="skill-btn" onclick="useSkill('punch')"><strong>自律鐵拳</strong><br><small style="color:var(--text-muted);">消耗 10 VIT</small></button>
      <button class="skill-btn" onclick="useSkill('shield')"><strong>心靈防壁</strong><br><small style="color:var(--text-muted);">消耗 15 WIL</small></button>
      <button class="skill-btn" onclick="useSkill('focus')"><strong>賢者模式</strong><br><small style="color:var(--text-muted);">消耗 20 INT</small></button>
      <button class="skill-btn" onclick="useSkill('burst')"><strong>終極爆發</strong><br><small style="color:var(--text-muted);">全屬性各消耗 10</small></button>
    </div>
  </div>

  <!-- 戒色修煉面板 -->
  <div class="card nopmo-card">
    <h3 style="color: var(--accent-purple); font-size: 1rem; margin-bottom: 5px;">戒色修煉</h3>
    <div class="nopmo-flex">
      <div>
        <div class="streak-count"><span id="nopmoDays">0</span> <small style="font-size: 0.9rem; color: #fff;">日</small></div>
        <p style="font-size: 0.8rem; color: var(--text-muted);">當前倍率：<span id="nopmoMultiplier" style="color: var(--accent-gold); font-weight: bold;">1x</span></p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <button class="btn btn-green" onclick="checkInNoPMO()">每日簽到 (領取加倍 EXP)</button>
        <button class="btn btn-blue" onclick="medicalRelax()">生理調節 (溫和放鬆)</button>
        <button class="btn btn-red" onclick="relapseNoPMO()">破戒重置</button>
      </div>
    </div>
  </div>

  <!-- 每日自律任務 -->
  <div class="card">
    <h3 style="margin-bottom: 5px; font-size: 1rem;">每日自律任務</h3>
    <div id="taskContainer"></div>
  </div>

  <!-- Boss 地下城面板 -->
  <div class="card boss-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="color: var(--accent-red); font-size: 1rem;">心魔 Boss 地下城</h3>
      <span class="boss-phase-badge" id="bossPhaseTag">Phase 1 / 7</span>
    </div>
    <div class="boss-avatar" id="bossAvatar">形態 1</div>
    <h4 id="bossName" style="font-size: 1.1rem;">怠惰心魔 - 蛇王森</h4>
    <p style="font-size: 0.75rem; color: var(--accent-gold); margin-bottom: 6px;" id="bossDesc">拖延症大魔王，陷喺梳化入面令你提唔起勁。</p>
    <div class="hp-bar-container"><div class="hp-bar" id="bossHpBar"></div></div>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">
      Boss HP: <span id="bossHp">200</span> / <span id="bossMaxHp">200</span>
    </p>
    <button class="btn btn-red" onclick="attackBoss()">發動普通自律攻擊</button>
  </div>

  <!-- 排行榜面板 -->
  <div class="card">
    <div class="leaderboard-header">
      <h3 style="color: var(--accent-gold); font-size: 1rem;">自律名人堂</h3>
      <button class="btn btn-blue" style="padding: 3px 8px; font-size: 0.75rem;" onclick="changePlayerName()">修改大名</button>
    </div>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">玩家：<strong id="playerNameDisplay" style="color:#fff;">無名哥布林</strong></p>
    <table class="leaderboard-table">
      <thead>
        <tr><th>排名</th><th>大名</th><th>等級與稱號</th><th>戒色天數</th><th>擊殺</th></tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>
</div>

<script>
  let state = {
    lv: 1,
    exp: 0,
    str: 5,
    int: 5,
    wil: 5,
    vit: 5,
    nopmoDays: 0,
    consecutiveRelaxCount: 0,
    lastCheckIn: null,
    bossSinIndex: 0,
    bossPhase: 1,
    bossHp: 200,
    bossMaxHp: 200,
    bossKills: 0,
    completedTasks: [],
    playerName: '無名哥布林'
  };

  const sinBosses = [
    {
      sin: "怠惰",
      phases: [
        { name: "蛇王森 (Phase 1)", avatar: "形態 1", desc: "拖延症大魔王，陷喺梳化入面令你提唔起勁。", hp: 200, atk: 2 },
        { name: "床褥沼澤 (Phase 2)", avatar: "形態 2", desc: "將你深深吸入床褥，意志開始瓦解！", hp: 800, atk: 5 },
        { name: "拖延黑洞 (Phase 3)", avatar: "形態 3", desc: "將所有自律計劃拖延至明日的黑洞！", hp: 2500, atk: 12 },
        { name: "時間蒸發者 (Phase 4)", avatar: "形態 4", desc: "偷走你所有光陰與青春的無形大魔王！", hp: 8000, atk: 25 },
        { name: "廢人氣場 (Phase 5)", avatar: "形態 5", desc: "散發讓全周圍失去所有動力與熱情的氣場！", hp: 25000, atk: 60 },
        { name: "萬劫石化尊 (Phase 6)", avatar: "形態 6", desc: "讓身體與心靈完全石化沉淪的半神心魔！", hp: 80000, atk: 150 },
        { name: "終極虛無怠惰神 (Phase 7)", avatar: "形態 7", desc: "怠惰之極致！終極神魔！", hp: 250000, atk: 400 }
      ]
    }
  ];

  const tasks = [
    // 身體 (3個)
    { id: 1, category: "身體", stat: "str", val: 1, text: "早起唔賴床 (08:00 前) [+體能]", exp: 15 },
    { id: 2, category: "身體", stat: "vit", val: 1, text: "飲足 2000ml 水 [+活力]", exp: 20 },
    { id: 3, category: "身體", stat: "str", val: 2, text: "做運動 / 健身 20 分鐘 [+體能]", exp: 40 },
    
    // 精神 (3個)
    { id: 4, category: "精神", stat: "int", val: 2, text: "睇書 / 學習新知識 15 分鐘 [+智力]", exp: 40 },
    { id: 5, category: "精神", stat: "int", val: 1, text: "戒糖 / 今日唔飲手搖飲品 [+智力]", exp: 15 },
    { id: 6, category: "精神", stat: "int", val: 2, text: "檢視與記錄今日花費開支 [+智力]", exp: 20 },
    
    // 心理 (3個)
    { id: 7, category: "心理", stat: "wil", val: 1, text: "清理房間 / 整理書桌環境 [+意志]", exp: 20 },
    { id: 8, category: "心理", stat: "wil", val: 2, text: "實施 15 分鐘冥想或拉筋放鬆 [+意志]", exp: 15 },
    { id: 9, category: "心理", stat: "wil", val: 2, text: "今晚 11:30 前熄燈安穩入睡 [+意志]", exp: 40 }
  ];

  function loadGame() {
    const saved = localStorage.getItem('goblin_save_v999');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        state = Object.assign(state, parsed);
      } catch (e) {
        console.error("Save load error:", e);
      }
    }
    const savedName = localStorage.getItem('goblin_player_name');
    if (savedName) state.playerName = savedName;
    updateUI();
  }

  function saveGame() {
    localStorage.setItem('goblin_save_v999', JSON.stringify(state));
  }

  function getMaxExp(level) {
    return Math.floor(50 * Math.pow(level, 1.3) + 50);
  }

  function getCurrentBoss() {
    let sin = sinBosses[state.bossSinIndex % sinBosses.length];
    let phaseIndex = (state.bossPhase - 1) % sin.phases.length;
    return sin.phases[phaseIndex];
  }

  function renderTasks() {
    const container = document.getElementById('taskContainer');
    if (!container) return;
    container.innerHTML = '';

    const categories = ["身體", "精神", "心理"];
    categories.forEach(cat => {
      const catTasks = tasks.filter(t => t.category === cat);
      if (catTasks.length === 0) return;

      const titleDiv = document.createElement('div');
      titleDiv.className = 'category-title';
      titleDiv.innerText = cat;
      container.appendChild(titleDiv);

      const ul = document.createElement('ul');
      ul.className = 'task-list';

      catTasks.forEach(task => {
        const isDone = Array.isArray(state.completedTasks) && state.completedTasks.includes(task.id);
        const li = document.createElement('li');
        li.className = 'task-item';

        const span = document.createElement('span');
        if (isDone) span.style.cssText = "text-decoration: line-through; color: var(--text-muted);";
        span.innerHTML = `${task.text} <small style="color: var(--accent-gold);">(+${task.exp} EXP)</small>`;

        const actionDiv = document.createElement('div');
        if (!isDone) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-green';
          btn.innerText = '搞掂';
          btn.onclick = function() { completeTask(task.id); };
          actionDiv.appendChild(btn);
        } else {
          const doneTag = document.createElement('span');
          doneTag.className = 'done-tag';
          doneTag.innerText = '已完成';
          actionDiv.appendChild(doneTag);
        }

        li.appendChild(span);
        li.appendChild(actionDiv);
        ul.appendChild(li);
      });

      container.appendChild(ul);
    });
  }

  function updateUI() {
    document.getElementById('goblinLv').innerText = state.lv;
    document.getElementById('currentExp').innerText = state.exp.toLocaleString();
    const maxExp = getMaxExp(state.lv);
    document.getElementById('maxExp').innerText = maxExp.toLocaleString();
    document.getElementById('expBar').style.width = Math.min((state.exp / maxExp) * 100, 100) + '%';

    document.getElementById('statStr').innerText = state.str;
    document.getElementById('statInt').innerText = state.int;
    document.getElementById('statWil').innerText = state.wil;
    document.getElementById('statVit').innerText = state.vit;

    const imgIdx = state.lv <= 10 ? 3 : (state.lv <= 30 ? 1 : 12);
    const imgEl = document.getElementById('goblinImg');
    if (imgEl) {
      imgEl.src = `哥布林進化路線插圖 (${imgIdx}).jpg`;
    }

    const multiplier = state.nopmoDays > 0 ? Math.pow(2, state.nopmoDays - 1) : 1;
    document.getElementById('nopmoDays').innerText = state.nopmoDays;
    document.getElementById('nopmoMultiplier').innerText = multiplier + 'x';

    renderTasks();

    const curBoss = getCurrentBoss();
    const bossAvatarEl = document.getElementById('bossAvatar');
    if (bossAvatarEl) bossAvatarEl.innerText = curBoss.avatar;
    const bossNameEl = document.getElementById('bossName');
    if (bossNameEl) bossNameEl.innerText = curBoss.name;
    const bossDescEl = document.getElementById('bossDesc');
    if (bossDescEl) bossDescEl.innerText = curBoss.desc;
    const bossPhaseTagEl = document.getElementById('bossPhaseTag');
    if (bossPhaseTagEl) bossPhaseTagEl.innerText = `Phase ${state.bossPhase} / 7`;
    const bossHpEl = document.getElementById('bossHp');
    if (bossHpEl) bossHpEl.innerText = state.bossHp.toLocaleString();
    const bossMaxHpEl = document.getElementById('bossMaxHp');
    if (bossMaxHpEl) bossMaxHpEl.innerText = state.bossMaxHp.toLocaleString();
    const bossHpBarEl = document.getElementById('bossHpBar');
    if (bossHpBarEl) bossHpBarEl.style.width = Math.max(0, (state.bossHp / state.bossMaxHp * 100)) + '%';

    const playerNameDisplayEl = document.getElementById('playerNameDisplay');
    if (playerNameDisplayEl) playerNameDisplayEl.innerText = state.playerName;
    renderLeaderboard();
  }

  function renderLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>#1</td><td><strong>${state.playerName}</strong></td><td>Lv.${state.lv} (油頭KAM撚哥布林)</td><td>${state.nopmoDays} 日</td><td>${state.bossKills} 隻</td>`;
    tbody.appendChild(tr);
  }

  function changePlayerName() {
    const newName = prompt("請輸入大名：", state.playerName);
    if (newName && newName.trim() !== '') {
      state.playerName = newName.trim();
      localStorage.setItem('goblin_player_name', state.playerName);
      saveGame();
      updateUI();
    }
  }

  function addExp(amount) {
    state.exp += amount;
    while (state.exp >= getMaxExp(state.lv) && state.lv < 999) {
      state.exp -= getMaxExp(state.lv);
      state.lv++;
      state.str += 2;
      state.int += 2;
      state.wil += 2;
      state.vit += 2;
      alert(`哥布林突破升呢去到 Lv.${state.lv}！全屬性大提升！`);
    }
    saveGame();
    updateUI();
  }

  function completeTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task && !state.completedTasks.includes(id)) {
      state.completedTasks.push(id);
      if (task.stat === 'str') state.str += task.val;
      if (task.stat === 'int') state.int += task.val;
      if (task.stat === 'wil') state.wil += task.val;
      if (task.stat === 'vit') state.vit += task.val;
      addExp(task.exp);
    }
  }

  function useSkill(type) {
    if (type === 'punch') {
      if (state.vit < 10) return alert('活力 (VIT) 不足 10 點！');
      state.vit -= 10;
      dealBossDamage(state.str * 20, '發動自律鐵拳！');
    } else if (type === 'shield') {
      if (state.wil < 15) return alert('意志 (WIL) 不足 15 點！');
      state.wil -= 15;
      addExp(500);
      alert('發動心靈防壁！獲得 500 EXP！');
    } else if (type === 'focus') {
      if (state.int < 20) return alert('智力 (INT) 不足 20 點！');
      state.int -= 20;
      dealBossDamage(state.int * 30, '進入賢者模式！');
    } else if (type === 'burst') {
      if (state.str < 10 || state.int < 10 || state.wil < 10 || state.vit < 10) {
        return alert('全屬性需各最少 10 點！');
      }
      state.str -= 10; state.int -= 10; state.wil -= 10; state.vit -= 10;
      dealBossDamage((state.str + state.int + state.wil + state.vit) * 30, '發動終極爆發！');
    }
    saveGame();
    updateUI();
  }

  function checkInNoPMO() {
    const today = new Date().toDateString();
    if (state.lastCheckIn === today) {
      return alert('今日已經簽過到啦！');
    }
    state.nopmoDays++;
    state.consecutiveRelaxCount = 0;
    state.lastCheckIn = today;
    state.wil += 3;
    state.vit += 3;
    const multiplier = Math.pow(2, state.nopmoDays - 1);
    const rewardExp = 10 * multiplier;
    addExp(rewardExp);
    alert(`戒色簽到成功！連續 ${state.nopmoDays} 日（${multiplier}x 倍率）！獲得 EXP +${rewardExp.toLocaleString()}！`);
  }

  function medicalRelax() {
    state.consecutiveRelaxCount++;
    if (state.consecutiveRelaxCount >= 2) {
      state.nopmoDays = 0;
      state.consecutiveRelaxCount = 0;
      addExp(-50);
      alert('連續兩日放鬆！戒色天數歸零，扣除 50 EXP！');
    } else {
      if (confirm('確定今日生理調節？（連續兩日將判定失敗）')) {
        addExp(-5);
        alert('生理調節完成！EXP -5');
      } else {
        state.consecutiveRelaxCount--;
      }
    }
    saveGame();
    updateUI();
  }

  function relapseNoPMO() {
    if (confirm('確定要重置天數？將會清空連續日數並扣除 100 EXP！')) {
      state.nopmoDays = 0;
      state.consecutiveRelaxCount = 0;
      addExp(-100);
      alert('戒色天數歸零！');
    }
  }

  function attackBoss() {
    const damage = (state.str + state.wil) * 10;
    dealBossDamage(damage, '發動普通自律攻擊！');
  }

  function dealBossDamage(damage, prefix) {
    state.bossHp -= damage;
    if (state.bossHp <= 0) {
      state.bossHp = 0;
      state.bossKills++;
      const expReward = 1000 * state.bossPhase * (state.bossSinIndex + 1);
      if (state.bossPhase < 7) {
        alert(`${prefix}\n成功擊破心魔！進入 Phase ${state.bossPhase + 1} 型態！`);
        state.bossPhase++;
      } else {
        alert(`${prefix}\n徹底淨化七大罪心魔終極形態！`);
        state.bossSinIndex++;
        state.bossPhase = 1;
      }
      addExp(expReward);
      const cur = getCurrentBoss();
      state.bossMaxHp = cur.hp;
      state.bossHp = state.bossMaxHp;
    } else {
      const cur = getCurrentBoss();
      state.vit = Math.max(0, state.vit - cur.atk);
      alert(`${prefix}\n造成 ${damage.toLocaleString()} 點自律傷害！\nBoss 反擊！活力 (VIT) 減少了 ${cur.atk} 點！`);
      if (state.vit === 0) {
        addExp(-50);
        state.vit = 5;
        alert('活力歸零陷入氣絕狀態！扣除 50 EXP！');
      }
    }
    saveGame();
    updateUI();
  }

  // 初始載入
  loadGame();
</script>
</body>
</html>
