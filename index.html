<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自律升級哥布林 Self-Discipline Goblin</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: #1a1d2d;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --accent-gold: #f1c40f;
      --accent-purple: #9b59b6;
      --accent-blue: #3498db;
      --text-light: #ecf0f1;
      --text-muted: #8e9aaf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 15px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #2d3248;
    }

    header h1 {
      color: var(--accent-green);
      font-size: 1.8rem;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2d3248;
    }

    /* Goblin Status */
    .goblin-status {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .goblin-avatar {
      font-size: 5rem;
      background: #25293c;
      padding: 15px;
      border-radius: 50%;
      border: 3px solid var(--accent-green);
      text-align: center;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-info {
      flex: 1;
    }

    .level-badge {
      display: inline-block;
      background: var(--accent-purple);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .exp-bar-container {
      background: #0f111a;
      height: 16px;
      border-radius: 8px;
      overflow: hidden;
      margin: 8px 0;
      border: 1px solid #3a3f58;
    }

    .exp-bar {
      height: 100%;
      background: linear-gradient(90deg, #27ae60, #2ecc71);
      width: 0%;
      transition: width 0.3s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
      text-align: center;
    }

    .stat-item {
      background: #25293c;
      padding: 8px;
      border-radius: 8px;
    }

    .stat-item label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
    }

    .stat-item val {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    /* No-PMO Section */
    .nopmo-card {
      border: 1px solid var(--accent-purple);
      background: linear-gradient(135deg, #1a1d2d, #251b34);
    }

    .nopmo-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .streak-count {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-green { background: var(--accent-green); color: #fff; }
    .btn-green:hover { background: #27ae60; }
    .btn-red { background: var(--accent-red); color: #fff; }
    .btn-red:hover { background: #c0392b; }
    .btn-blue { background: var(--accent-blue); color: #fff; }
    .btn-blue:hover { background: #2980b9; }

    /* Task List */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #25293c;
      padding: 12px 15px;
      border-radius: 8px;
    }

    .task-item.locked {
      opacity: 0.5;
      background: #181b28;
      border: 1px dashed #3a3f58;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    /* Dungeon & Boss */
    .boss-card {
      text-align: center;
      border: 1px solid var(--accent-red);
    }

    .boss-avatar { font-size: 4rem; margin: 10px 0; }

    .hp-bar-container {
      background: #0f111a;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin: 10px 0;
      border: 1px solid #3a3f58;
    }

    .hp-bar {
      height: 100%;
      background: var(--accent-red);
      width: 100%;
      transition: width 0.3s ease;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .goblin-status { flex-direction: column; text-align: center; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .nopmo-flex { flex-direction: column; gap: 15px; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>👹 自律升級哥布林 (Lv.1 - 999)</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem;">十進位幾何級數經驗 + 連續放鬆 2 天即判定失敗！</p>
  </header>

  <!-- Goblin Main Status -->
  <div class="card goblin-status">
    <div class="goblin-avatar" id="goblinAvatar">👺</div>
    <div class="status-info">
      <div>
        <span class="level-badge" id="goblinRank">Hea底廢柴哥布林</span>
        <strong style="font-size: 1.2rem;">Lv. <span id="goblinLv">1</span> / 999</strong>
      </div>
      <div class="exp-bar-container">
        <div class="exp-bar" id="expBar"></div>
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted);">
        EXP: <span id="currentExp">0</span> / <span id="maxExp">1</span>
      </div>

      <div class="stats-grid">
        <div class="stat-item"><label>💪 體能 (STR)</label><val id="statStr">5</val></div>
        <div class="stat-item"><label>🧠 智力 (INT)</label><val id="statInt">5</val></div>
        <div class="stat-item"><label>🛡️ 意志 (WIL)</label><val id="statWil">5</val></div>
        <div class="stat-item"><label>⚡ 活力 (VIT)</label><val id="statVit">5</val></div>
      </div>
    </div>
  </div>

  <!-- No-PMO Section -->
  <div class="card nopmo-card">
    <h3 style="color: var(--accent-purple); margin-bottom: 5px;">🔥 戒色修煉 (等比加倍獎勵)</h3>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">連續放鬆 2 日當失敗；達 10 日解鎖「SSIS-531的誘惑」！</p>
    <div class="nopmo-flex">
      <div>
        <div class="streak-count"><span id="nopmoDays">0</span> <small style="font-size: 1rem; color: #fff;">日</small></div>
        <p style="font-size: 0.85rem; color: var(--text-muted);">當前加倍倍率：<span id="nopmoMultiplier" style="color: var(--accent-gold); font-weight: bold;">1x</span></p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-green" onclick="checkInNoPMO()">每日簽到 (領取加倍 EXP)</button>
        <button class="btn btn-blue" onclick="medicalRelax()">醫學健康放鬆 (溫和調節)</button>
        <button class="btn btn-red" onclick="relapseNoPMO()">破戒重置 (心魔反噬)</button>
      </div>
    </div>
  </div>

  <!-- Task Section -->
  <div class="card">
    <h3 style="margin-bottom: 5px;">📋 每日自律任務</h3>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">提升等級可以解鎖更多自律任務！</p>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <!-- Boss Dungeon Section -->
  <div class="card boss-card">
    <h3 style="color: var(--accent-red);">⚔️ 心魔 Boss 地下城</h3>
    <div class="boss-avatar">👹</div>
    <h4>拖延大魔王 - 蛇王森</h4>
    <div class="hp-bar-container">
      <div class="hp-bar" id="bossHpBar"></div>
    </div>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">
      Boss HP: <span id="bossHp">200</span> / <span id="bossMaxHp">200</span>
    </p>
    <button class="btn btn-red" onclick="attackBoss()">發動自律攻擊！</button>
  </div>
</div>

<script>
  let state = {
    lv: 1,
    exp: 0,
    str: 5,
    int: 5,
    wil: 5,
    vit: 5,
    nopmoDays: 0,
    consecutiveRelaxCount: 0,
    lastNopmoCheck: null,
    bossHp: 200,
    bossMaxHp: 200,
    completedTasksToday: []
  };

  const allTasks = [
    { id: 1, unlockLv: 1, text: "早起唔賴床 (08:00 前)", exp: 1 },
    { id: 2, unlockLv: 2, text: "飲足 2000ml 水", exp: 5 },
    { id: 3, unlockLv: 3, text: "做運動 20 分鐘", exp: 20 },
    { id: 4, unlockLv: 4, text: "睇書 / 學習 15 分鐘", exp: 50 },
    { id: 5, unlockLv: 5, text: "清理房間 / 整理桌面", exp: 100 },
    { id: 6, unlockLv: 6, text: "食一餐健康清淡餐", exp: 250 },
    { id: 7, unlockLv: 7, text: "戒糖 / 唔飲手搖飲品", exp: 500 },
    { id: 8, unlockLv: 8, text: "實施 15 分鐘冥想拉筋", exp: 1000 },
    { id: 9, unlockLv: 9, text: "檢視與記錄今日花費", exp: 2500 },
    { id: 10, unlockLv: 10, text: "今晚 11:30 前熄燈睡覺", exp: 5000 },
    { id: 11, unlockLv: 20, text: "連續做 50 次俯臥撐 / 仰臥起坐", exp: 8000 },
    { id: 12, unlockLv: 30, text: "學習外語 / 新技能 30 分鐘", exp: 15000 },
    { id: 13, unlockLv: 40, text: "晨跑 / 散步 5000 步", exp: 30000 },
    { id: 14, unlockLv: 50, text: "完全關掉社群媒體 2 小時", exp: 60000 },
    { id: 15, unlockLv: 60, text: "閱讀深度書籍 45 分鐘", exp: 100000 },
    { id: 16, unlockLv: 70, text: "完成全套核心肌群訓練", exp: 200000 },
    { id: 17, unlockLv: 80, text: "撰寫今日自律檢討日誌", exp: 400000 },
    { id: 18, unlockLv: 90, text: "連續冷水澡沖涼洗滌意志", exp: 800000 },
    { id: 19, unlockLv: 100, text: "挑戰一日零娛樂全集中工作", exp: 1500000 },
    { id: 20, unlockLv: 200, text: "挑戰極限：10000 步 + 1 小時健身", exp: 3000000 },
    { id: 21, unlockLv: 250, text: "極致專注：連續 4 小時無干擾工作", exp: 6000000 },
    { id: 22, unlockLv: 300, text: "終極自律：連續 7 日完美執行所有任務", exp: 12000000 },
    { id: 23, unlockLv: 350, text: "體能爆發：完成 10 公里長跑", exp: 25000000 },
    { id: 24, unlockLv: 400, text: "大師心境：進行 1 小時深度冥想", exp: 50000000 },
    { id: 25, unlockLv: 500, text: "至尊自律：一日閱讀完一整本書", exp: 100000000 }
  ];

  const evolutions = [
    { maxLv: 10, title: "Hea底廢柴哥布林", avatar: "👺" },
    { maxLv: 30, title: "唔浦頭 識郁哥布林", avatar: "🚶" },
    { maxLv: 70, title: "捱得夜 頂癮哥布林", avatar: "🏃" },
    { maxLv: 150, title: "堅料 鐵人哥布林", avatar: "🦾" },
    { maxLv: 300, title: "chur 爆全場 哥布林大隻佬", avatar: "💪" },
    { maxLv: 500, title: "堅·自律 陀地大佬", avatar: "🕶️" },
    { maxLv: 750, title: "逢兇化吉 燈神哥布林", avatar: "⚡" },
    { maxLv: 998, title: "橫掃千軍 自律界話事人", avatar: "👑" },
    { maxLv: 999, title: "宇宙無敵 終極自律神", avatar: "🌌" }
  ];

  function getMaxExp(level) {
    if (level >= 999) return 1e30;
    return Math.pow(10, level - 1);
  }

  function loadGame() {
    const saved = localStorage.getItem('goblin_save');
    if (saved) {
      state = Object.assign(state, JSON.parse(saved));
    }
    updateUI();
  }

  function saveGame() {
    localStorage.setItem('goblin_save', JSON.stringify(state));
  }

  function updateUI() {
    document.getElementById('goblinLv').innerText = state.lv;
    document.getElementById('currentExp').innerText = state.exp.toLocaleString();
    const maxExp = getMaxExp(state.lv);
    document.getElementById('maxExp').innerText = maxExp.toLocaleString();
    
    let expPercent = (state.exp / maxExp) * 100;
    if (expPercent < 0) expPercent = 0;
    document.getElementById('expBar').style.width = Math.min(expPercent, 100) + '%';

    document.getElementById('statStr').innerText = state.str;
    document.getElementById('statInt').innerText = state.int;
    document.getElementById('statWil').innerText = state.wil;
    document.getElementById('statVit').innerText = state.vit;

    let currentEvo = evolutions.find(e => state.lv <= e.maxLv) || evolutions[evolutions.length - 1];
    document.getElementById('goblinRank').innerText = currentEvo.title;
    document.getElementById('goblinAvatar').innerText = currentEvo.avatar;

    const multiplier = state.nopmoDays > 0 ? Math.pow(2, state.nopmoDays - 1) : 1;
    document.getElementById('nopmoDays').innerText = state.nopmoDays;
    document.getElementById('nopmoMultiplier').innerText = multiplier + 'x';

    const listEl = document.getElementById('taskList');
    listEl.innerHTML = '';

    allTasks.forEach(task => {
      const isUnlocked
