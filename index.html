<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我要成為LV999哥布林</title>
  <!-- Supabase JS Client (免費線上排行榜) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: #1a1d2d;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --accent-gold: #f1c40f;
      --accent-purple: #9b59b6;
      --accent-blue: #3498db;
      --text-light: #ecf0f1;
      --text-muted: #8e9aaf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 20px; }
    header { text-align: center; padding: 15px; background: var(--card-bg); border-radius: 12px; border: 1px solid #2d3248; }
    header h1 { color: var(--accent-green); font-size: 2rem; letter-spacing: 1px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #2d3248; }

    /* 哥布林狀態與頭像 */
    .goblin-status { display: flex; align-items: center; gap: 20px; }
    .goblin-avatar-box { width: 140px; height: 140px; border-radius: 12px; border: 3px solid var(--accent-green); overflow: hidden; background: #000; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2); }
    .goblin-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .status-info { flex: 1; }
    .level-badge { display: inline-block; background: var(--accent-purple); padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 0.95rem; margin-bottom: 5px; color: #fff; }
    .route-badge { display: inline-block; background: #25293c; border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 2px 8px; border-radius: 8px; font-size: 0.75rem; margin-left: 5px; }
    .exp-bar-container { background: #0f111a; height: 16px; border-radius: 8px; overflow: hidden; margin: 8px 0; border: 1px solid #3a3f58; }
    .exp-bar { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); width: 0%; transition: width 0.3s ease; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; text-align: center; }
    .stat-item { background: #25293c; padding: 8px; border-radius: 8px; }
    .stat-item label { font-size: 0.8rem; color: var(--text-muted); display: block; }
    .stat-item val { font-size: 1.1rem; font-weight: bold; color: var(--accent-gold); }

    /* 技能與按鈕 */
    .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .skill-btn { background: #25293c; border: 1px solid #3a3f58; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; }
    .skill-btn:hover { background: #323750; border-color: var(--accent-gold); }
    .nopmo-card { border: 1px solid var(--accent-purple); background: linear-gradient(135deg, #1a1d2d, #251b34); }
    .nopmo-flex { display: flex; justify-content: space-between; align-items: center; }
    .streak-count { font-size: 2.5rem; font-weight: bold; color: var(--accent-gold); }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-green { background: var(--accent-green); color: #fff; } .btn-green:hover { background: #27ae60; }
    .btn-red { background: var(--accent-red); color: #fff; } .btn-red:hover { background: #c0392b; }
    .btn-blue { background: var(--accent-blue); color: #fff; } .btn-blue:hover { background: #2980b9; }

    /* 任務與 7 階 Boss 專區 */
    .category-title { font-size: 1.1rem; color: var(--accent-gold); margin: 15px 0 10px 0; border-bottom: 1px solid #2d3248; padding-bottom: 5px; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: #25293c; padding: 12px 15px; border-radius: 8px; }
    .task-item.locked { opacity: 0.5; background: #181b28; border: 1px dashed #3a3f58; }
    .task-actions { display: flex; gap: 8px; }
    .boss-card { text-align: center; border: 1px solid var(--accent-red); background: linear-gradient(180deg, #1a1d2d, #2d151c); }
    .boss-avatar { font-size: 4rem; margin: 10px 0; }
    .boss-phase-badge { background: var(--accent-red); color: #fff; padding: 3px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; }
    .hp-bar-container { background: #0f111a; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0; border: 1px solid #3a3f58; }
    .hp-bar { height: 100%; background: var(--accent-red); width: 100%; transition: width 0.3s ease; }
    .leaderboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .leaderboard-table { width: 100%; border-collapse: collapse; }
